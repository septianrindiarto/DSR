# ─────────────────────────────────────────────────────────────────────────────
# nginx site for dsrappai.com  →  /etc/nginx/sites-available/dsr
#   ln -s /etc/nginx/sites-available/dsr /etc/nginx/sites-enabled/dsr
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dsrappai.com -d www.dsrappai.com   (adds HTTPS + redirect)
#
# The web build (static) is served directly; /api and /uploads go to the API.
# /uploads is PROXIED (not aliased) so the API keeps blocking legacy sensitive
# files (driver-*, finance/*) — never serve the uploads folder straight from disk.
# Private files (SIM/KTP, receipts, legal docs) live in uploads-private and are
# only reachable through authenticated API endpoints.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name dsrappai.com www.dsrappai.com;

    root /home/dsr/dsr/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Uploads: evidence photos / PDFs up to 10 MB each, up to 5 per request.
    client_max_body_size 55M;

    # Basic hardening for the static site (the API sets its own headers via helmet).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # Service worker + manifest must not be cached for long, or updates never reach phones.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other path loads index.html (never cached, so new deploys show at once).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
